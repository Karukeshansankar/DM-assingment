<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova SmartWatch | Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">NOVA</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Product</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 style="text-align: center; margin-bottom: 20px;">Contact Support</h1>
        
        <div class="contact-form">
            <form>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="How can we help you?"></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </div>

    <div class="container">
        <h3>Frequently Asked Questions</h3>
        <div style="background: white; padding: 20px; margin-top: 10px; border-radius: 8px;">
            <p><strong>Q: How long does shipping take?</strong><br>A: Standard shipping takes 3-5 business days.</p>
            <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
            <p><strong>Q: What is the warranty?</strong><br>A: We offer a 2-year warranty on all manufacturing defects.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Nova SmartWatch. All Rights Reserved.</p>
    </footer>

</body>
</html>
